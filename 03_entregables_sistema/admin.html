<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel · Dulces Celis</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><script>tailwind.config={theme:{extend:{colors:{crema:'#F9F0DA',rosa:'#F0C2D2',frambuesa:'#C72940',chocolate:'#641410'}}}}</script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:'Plus Jakarta Sans',sans-serif;background:#F9F0DA;color:#641410}.serif{font-family:'Playfair Display',serif}.tab.active{background:#C72940;color:#fff;box-shadow:0 8px 20px #c7294033}.modal{display:none}.modal.open{display:flex}</style></head><body>
<div id="login" class="flex min-h-screen items-center justify-center p-5"><form id="pinForm" class="w-full max-w-sm rounded-[2rem] bg-white/80 p-8 text-center shadow-xl"><img src="assets/logo_sticker_circular.png" class="mx-auto mb-5 h-24 w-24 rounded-full object-contain" alt="Dulces Celis"><p class="text-xs font-extrabold uppercase tracking-[.25em] text-frambuesa">Dulces Celis</p><h1 class="serif mt-2 text-3xl font-bold">Panel de control</h1><p class="mt-2 text-sm opacity-70">Ingresa el PIN para administrar el negocio.</p><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="••••" class="mt-6 w-full rounded-2xl border-0 bg-crema p-3 text-center text-xl tracking-[.4em]" required><button class="mt-4 w-full rounded-full bg-frambuesa py-3 font-bold text-white">Entrar</button><p id="loginMsg" class="mt-3 text-sm text-frambuesa"></p></form></div>
<main id="app" class="mx-auto hidden max-w-6xl px-4 py-6 sm:px-6"><header class="flex flex-wrap items-center justify-between gap-4"><div><p class="text-xs font-extrabold uppercase tracking-[.25em] text-frambuesa">Dulces Celis</p><h1 class="serif text-4xl font-bold">Panel de control</h1><p class="mt-1 text-sm opacity-70">Catálogo, pedidos y señales del negocio.</p></div><div class="flex gap-2"><a href="index.html" class="rounded-full border border-frambuesa px-4 py-2 text-sm font-bold text-frambuesa">Ver tienda</a><button id="logout" class="rounded-full bg-rosa px-4 py-2 text-sm font-bold">Salir</button></div></header><nav class="mt-8 flex flex-wrap gap-2 rounded-2xl bg-white/45 p-2"><button class="tab active rounded-full px-4 py-2 text-sm font-bold" data-tab="catalog">Catálogo</button><button class="tab rounded-full px-4 py-2 text-sm font-bold" data-tab="ordersTab">Pedidos</button><button class="tab rounded-full px-4 py-2 text-sm font-bold" data-tab="metrics">Métricas de negocio</button></nav>
<section id="catalog" class="tab-panel mt-6"><div class="mb-4 flex flex-wrap items-center justify-between gap-3"><h2 class="serif text-2xl font-bold">Catálogo</h2><div class="flex items-center gap-3"><span id="saveMsg" class="text-sm"></span><button id="newProduct" class="rounded-full bg-frambuesa px-4 py-2 text-sm font-bold text-white">+ Nuevo producto</button></div></div><div id="products" class="space-y-3"></div></section>
<section id="ordersTab" class="tab-panel mt-6 hidden"><div class="mb-4 flex flex-wrap items-center justify-between gap-3"><h2 class="serif text-2xl font-bold">Pedidos recientes</h2><button id="clearOrders" class="rounded-full border border-frambuesa px-4 py-2 text-sm font-bold text-frambuesa">Limpiar historial</button></div><p id="ordersHint" class="mb-3 text-sm opacity-60"></p><div id="orders" class="space-y-3"></div></section>
<section id="metrics" class="tab-panel mt-6 hidden"><div class="flex flex-wrap items-end justify-between gap-3"><div><h2 class="serif text-2xl font-bold">Métricas de negocio</h2><p id="metricsMode" class="mt-1 text-sm opacity-65"></p></div><button id="refreshMetrics" class="rounded-full bg-rosa px-4 py-2 text-sm font-bold">Actualizar</button></div><div id="kpis" class="mt-5 grid gap-3 sm:grid-cols-3"></div><div class="mt-5 grid gap-5 lg:grid-cols-2"><article class="rounded-3xl bg-white/75 p-4 shadow-sm"><h3 class="mb-3 font-bold">Postres más vendidos</h3><div class="h-64"><canvas id="topChart"></canvas></div></article><article class="rounded-3xl bg-white/75 p-4 shadow-sm"><h3 class="mb-3 font-bold">Ventas por periodo</h3><div class="h-64"><canvas id="salesChart"></canvas></div></article></div></section></main>
<div id="productModal" class="modal fixed inset-0 z-50 items-center justify-center bg-chocolate/40 p-4"><form id="productForm" class="max-h-[90vh] w-full max-w-lg overflow-y-auto rounded-3xl bg-crema p-6 shadow-2xl"><div class="flex items-center justify-between"><h2 id="productModalTitle" class="serif text-3xl font-bold">Nuevo producto</h2><button type="button" data-close="productModal" class="text-2xl">×</button></div><input type="hidden" name="id"><label class="mt-4 block text-sm font-bold">Nombre<input required name="name" class="mt-1 w-full rounded-xl border-0 bg-white/70 p-3"></label><label class="mt-3 block text-sm font-bold">Categoría<select required name="category" id="categorySelect" class="mt-1 w-full rounded-xl border-0 bg-white/70 p-3"></select></label><div class="mt-3 grid gap-3 sm:grid-cols-2"><label class="text-sm font-bold">Precio<input required name="price" type="number" min="0" step=".01" class="mt-1 w-full rounded-xl border-0 bg-white/70 p-3"></label><label class="text-sm font-bold">Días de anticipación<input required name="days" type="number" min="1" value="1" class="mt-1 w-full rounded-xl border-0 bg-white/70 p-3"></label></div><label class="mt-3 block text-sm font-bold">Descripción<textarea name="description" rows="2" class="mt-1 w-full rounded-xl border-0 bg-white/70 p-3"></textarea></label><label class="mt-3 block text-sm font-bold">URL de imagen<input name="image" type="url" class="mt-1 w-full rounded-xl border-0 bg-white/70 p-3" placeholder="https://..."></label><label class="mt-3 block text-sm font-bold">O seleccionar imagen<input id="imageFile" name="imageFile" type="file" accept="image/*" class="mt-1 w-full rounded-xl bg-white/70 p-3 text-sm"></label><label class="mt-3 flex items-center gap-2 text-sm font-bold"><input name="customizable" type="checkbox" class="h-5 w-5 accent-[#C72940]"> Es personalizable</label><div class="mt-5 flex gap-2"><button type="button" data-close="productModal" class="flex-1 rounded-full bg-rosa py-3 font-bold">Cancelar</button><button class="flex-1 rounded-full bg-frambuesa py-3 font-bold text-white">Guardar producto</button></div><p id="productMessage" class="mt-3 text-center text-xs"></p></form></div>
<div id="confirmModal" class="modal fixed inset-0 z-[60] items-center justify-center bg-chocolate/40 p-4"><div class="w-full max-w-sm rounded-3xl bg-crema p-6 shadow-2xl"><h2 id="confirmTitle" class="serif text-2xl font-bold">¿Confirmar acción?</h2><p id="confirmText" class="mt-2 text-sm opacity-75"></p><div class="mt-5 flex gap-2"><button id="cancelConfirm" class="flex-1 rounded-full bg-rosa py-3 font-bold">Cancelar</button><button id="acceptConfirm" class="flex-1 rounded-full bg-frambuesa py-3 font-bold text-white">Confirmar</button></div></div></div>
<script>
const SUPABASE_URL='https://bmcstomcftwjyrcfptsb.supabase.co',SUPABASE_ANON_KEY='sb_publishable_aAEj9j1dap8YXXnRj_qAZw_McrrrmHb',ADMIN_PIN='2643';let products=[],orders=[],categories=[],topChart,salesChart,pendingConfirm;const $=s=>document.querySelector(s),headers={apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json'};async function api(path,opts={}){const r=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{...opts,headers:{...headers,...opts.headers}});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function orderItems(o){const d=o.detalles_json||{};return Array.isArray(d)?d:(d.items||[])}
async function load(){try{[products,orders,categories]=await Promise.all([api('productos?select=*,categorias(id,nombre,slug)&order=id'),api('pedidos?select=*&order=created_at.desc&limit=100'),api('categorias?select=*&order=id')])}catch(e){console.error(e)}renderProducts();renderOrders();renderMetrics()}function renderProducts(){$('#products').innerHTML=products.map(p=>`<article class="rounded-3xl bg-white/75 p-4 shadow-sm"><div class="flex flex-wrap items-start gap-4"><img src="${esc(p.imagen_url||'assets/logo_sticker_circular.png')}" class="h-20 w-20 rounded-2xl object-cover" alt=""><div class="min-w-[13rem] flex-1"><h3 class="font-bold">${esc(p.nombre)}</h3><p class="text-xs opacity-60">${esc(p.categorias?.nombre||'Sin categoría')} · ${p.dias_anticipacion} día(s)</p><textarea data-desc="${p.id}" class="mt-2 w-full rounded-2xl border-0 bg-crema p-3 text-sm">${esc(p.descripcion)}</textarea></div><label class="w-28 text-xs font-bold">Precio<input data-price="${p.id}" type="number" min="0" step=".01" value="${p.precio}" class="mt-1 w-full rounded-xl border-0 bg-crema p-2"></label><label class="flex items-center gap-2 text-sm font-bold"><input data-active="${p.id}" type="checkbox" ${p.activo?'checked':''} class="h-5 w-5 accent-[#C72940]"> Activo</label></div><div class="mt-3 flex flex-wrap gap-2"><button data-edit="${p.id}" class="rounded-full bg-rosa px-4 py-2 text-sm font-bold">Editar nombre/foto</button><button data-save="${p.id}" class="rounded-full bg-frambuesa px-4 py-2 text-sm font-bold text-white">Guardar cambios</button><button data-delete="${p.id}" class="rounded-full border border-frambuesa px-4 py-2 text-sm font-bold text-frambuesa">Eliminar permanentemente</button></div></article>`).join('');document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveProduct(+b.dataset.save));document.querySelectorAll('[data-active]').forEach(b=>b.onchange=()=>saveProduct(+b.dataset.active,true));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openProduct(+b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>confirmAction('Eliminar producto','Esta acción no se puede deshacer.',()=>deleteProduct(+b.dataset.delete)))}
async function saveProduct(id,silent=false){const p=products.find(x=>x.id===id);const body={precio:Number($(`[data-price="${id}"]`).value),descripcion:$(`[data-desc="${id}"]`).value,activo:$(`[data-active="${id}"]`).checked};try{await api(`productos?id=eq.${id}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});Object.assign(p,body);if(!silent)flash('Cambios guardados')}catch(e){flash('Error al guardar')}}async function deleteProduct(id){try{await api(`productos?id=eq.${id}`,{method:'DELETE'});products=products.filter(p=>p.id!==id);renderProducts();flash('Producto eliminado')}catch(e){flash('No se pudo eliminar el producto')}}function flash(t){$('#saveMsg').textContent=t;setTimeout(()=>$('#saveMsg').textContent='',2500)}
function openProduct(id=null){const p=id&&products.find(x=>x.id===id),f=$('#productForm');f.reset();f.id.value=p?.id||'';f.name.value=p?.nombre||'';f.category.value=p?.categorias?.id||categories[0]?.id||'';f.price.value=p?.precio||'';f.days.value=p?.dias_anticipacion||1;f.description.value=p?.descripcion||'';f.image.value=p?.imagen_url?.startsWith('http')?p.imagen_url:'';f.customizable.checked=!!p?.es_personalizable;$('#productModalTitle').textContent=p?'Editar producto':'Nuevo producto';$('#productModal').classList.add('open')}function renderCategories(){$('#categorySelect').innerHTML=categories.map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join('')}
$('#productForm').onsubmit=async e=>{e.preventDefault();const f=e.target;let image=f.image.value.trim();const file=f.imageFile.files[0];if(file)image=await new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(file)});const data={nombre:f.name.value.trim(),categoria_id:Number(f.category.value),precio:Number(f.price.value),dias_anticipacion:Number(f.days.value),descripcion:f.description.value.trim(),imagen_url:image||'assets/logo_sticker_circular.png',es_personalizable:f.customizable.checked,activo:true};try{if(f.elements.id.value){await api(`productos?id=eq.${f.elements.id.value}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(data)})}else{await api('productos',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(data)})}$('#productModal').classList.remove('open');await load();flash('Producto guardado')}catch(err){$('#productMessage').textContent='No se pudo guardar. Verifica la categoría y los datos.';console.error(err)}};
function renderOrders(){$('#ordersHint').textContent=`${orders.length} pedidos registrados`;$('#orders').innerHTML=orders.length?orders.map(o=>`<article class="rounded-3xl bg-white/75 p-4 shadow-sm"><div class="flex flex-wrap items-start justify-between gap-3"><div><p class="font-bold">#DC-${String(o.id).padStart(4,'0')} · ${esc(o.cliente_nombre)}</p><p class="text-sm opacity-75">Entrega: ${esc(o.fecha_entrega)} · ${esc(o.cliente_whatsapp)}</p><p class="mt-2 text-sm">${orderItems(o).map(i=>`${i.cantidad} × ${esc(i.producto||i.nombre)}`).join(', ')||'Detalle no disponible'}</p></div><div class="text-right"><p class="font-bold text-frambuesa">$${Number(o.total).toFixed(2)}</p><select data-state="${o.id}" class="mt-2 rounded-xl border-0 bg-crema p-2 text-sm"><option ${o.estado==='Pendiente'?'selected':''}>Pendiente</option><option ${o.estado==='En Preparación'?'selected':''}>En Preparación</option><option ${o.estado==='Entregado'?'selected':''}>Entregado</option></select></div></div></article>`).join(''):'<p class="rounded-2xl bg-white/60 p-6 text-center opacity-70">Aún no hay pedidos registrados.</p>';document.querySelectorAll('[data-state]').forEach(s=>s.onchange=async()=>{await api(`pedidos?id=eq.${s.dataset.state}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({estado:s.value})});const o=orders.find(x=>x.id==s.dataset.state);if(o)o.estado=s.value;renderMetrics()})}
function demoOrders(){const names=['Marquesa de chocolate','Galletas con chispas','Brownie individual','Torta de fresas con crema','Torta temática'];return Array.from({length:12},(_,i)=>({total:[28,42,18,65,75,36,54,22,88,47,31,70][i],created_at:new Date(Date.now()-(11-i)*7*86400000).toISOString(),detalles_json:{items:[{producto:names[i%names.length],cantidad:(i%3)+1}]}}))}function renderMetrics(){const real=orders.length>0,source=real?orders:demoOrders(),month=new Date().toISOString().slice(0,7),mo=source.filter(o=>String(o.created_at).slice(0,7)===month),revenue=mo.reduce((s,o)=>s+Number(o.total||0),0);$('#metricsMode').textContent=real?'Datos basados en pedidos de Supabase.':'Sin pedidos reales todavía · mostrando datos de demostración.';$('#kpis').innerHTML=[['Ingresos del mes',`$${revenue.toFixed(2)}`],['Pedidos del mes',mo.length],['Ticket promedio',`$${(mo.length?revenue/mo.length:0).toFixed(2)}`]].map(x=>`<article class="rounded-3xl bg-white/75 p-5 shadow-sm"><p class="text-sm opacity-70">${x[0]}</p><p class="serif mt-2 text-3xl font-bold">${x[1]}</p></article>`).join('');const totals={};source.forEach(o=>orderItems(o).forEach(i=>{const n=i.producto||i.nombre||'Producto';totals[n]=(totals[n]||0)+Number(i.cantidad||1)}));const top=Object.entries(totals).sort((a,b)=>b[1]-a[1]).slice(0,6);if(topChart)topChart.destroy();if(salesChart)salesChart.destroy();topChart=new Chart($('#topChart'),{type:'bar',data:{labels:top.map(x=>x[0]),datasets:[{data:top.map(x=>x[1]),backgroundColor:'#C72940',borderRadius:10}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});const buckets={};source.forEach(o=>{const d=new Date(o.created_at),key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;buckets[key]=(buckets[key]||0)+Number(o.total||0)});const labels=Object.keys(buckets).sort();salesChart=new Chart($('#salesChart'),{type:'line',data:{labels:labels.map(x=>x.slice(5)),datasets:[{label:'Ventas $',data:labels.map(x=>buckets[x]),borderColor:'#C72940',backgroundColor:'#F0C2D2',fill:true,tension:.35}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}})}
function confirmAction(title,text,action){$('#confirmTitle').textContent=title;$('#confirmText').textContent=text;pendingConfirm=action;$('#confirmModal').classList.add('open')}$('#acceptConfirm').onclick=async()=>{const a=pendingConfirm;$('#confirmModal').classList.remove('open');if(a)await a()};$('#cancelConfirm').onclick=()=>$('#confirmModal').classList.remove('open');$('#clearOrders').onclick=()=>confirmAction('Vaciar pedidos','Se eliminará todo el historial de pedidos de Supabase.',async()=>{try{await api('pedidos?id=gt.0',{method:'DELETE'});orders=[];renderOrders();renderMetrics();flash('Historial vaciado')}catch(e){flash('No se pudo vaciar el historial')}});$('#newProduct').onclick=()=>openProduct();document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).classList.remove('open'));document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab-panel').forEach(x=>x.classList.add('hidden'));b.classList.add('active');$('#'+b.dataset.tab).classList.remove('hidden');if(b.dataset.tab==='metrics')renderMetrics()});$('#refreshMetrics').onclick=load;$('#pinForm').onsubmit=e=>{e.preventDefault();if($('#pin').value===ADMIN_PIN){sessionStorage.admin='ok';showApp()}else $('#loginMsg').textContent='PIN incorrecto'};function showApp(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');load().then(renderCategories)}$('#logout').onclick=()=>{sessionStorage.removeItem('admin');location.reload()};if(sessionStorage.admin==='ok')showApp();
</script></body></html>
