<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel · Dulces Celis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script>tailwind.config={theme:{extend:{colors:{crema:'#F9F0DA',rosa:'#F0C2D2',frambuesa:'#C72940',chocolate:'#641410'}}}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:'Plus Jakarta Sans',sans-serif;background:#F9F0DA;color:#641410}.serif{font-family:'Playfair Display',serif}.tab.active{background:#C72940;color:white;box-shadow:0 8px 20px #c7294033}</style>
</head>
<body>
  <div id="login" class="flex min-h-screen items-center justify-center p-5"><form id="pinForm" class="w-full max-w-sm rounded-[2rem] bg-white/75 p-8 text-center shadow-xl"><img src="assets/logo.png" class="mx-auto mb-5 h-20 w-32 object-contain" alt="Dulces Celis"><p class="text-xs font-extrabold uppercase tracking-[.25em] text-frambuesa">Dulces Celis</p><h1 class="serif mt-2 text-3xl font-bold">Panel de control</h1><p class="mt-2 text-sm opacity-70">Ingresa el PIN para administrar el negocio.</p><input id="pin" inputmode="numeric" type="password" maxlength="8" class="mt-6 w-full rounded-2xl border-0 bg-crema p-3 text-center text-xl tracking-[.4em] outline-none ring-frambuesa focus:ring-2" placeholder="••••" required><button class="mt-4 w-full rounded-full bg-frambuesa py-3 font-bold text-white shadow-lg shadow-frambuesa/20">Entrar</button><p id="loginMsg" class="mt-3 text-sm text-frambuesa"></p></form></div>
  <main id="app" class="mx-auto hidden max-w-6xl px-4 py-6 sm:px-6">
    <header class="flex flex-wrap items-center justify-between gap-4"><div><p class="text-xs font-extrabold uppercase tracking-[.25em] text-frambuesa">Dulces Celis</p><h1 class="serif text-4xl font-bold">Panel de control</h1><p class="mt-1 text-sm opacity-70">Catálogo, pedidos y señales del negocio.</p></div><div class="flex gap-2"><a href="index.html" class="rounded-full border border-frambuesa px-4 py-2 text-sm font-bold text-frambuesa">Ver tienda</a><button id="logout" class="rounded-full bg-rosa px-4 py-2 text-sm font-bold">Salir</button></div></header>
    <nav class="mt-8 flex gap-2 overflow-x-auto rounded-2xl bg-white/45 p-2"><button class="tab active whitespace-nowrap rounded-full px-4 py-2 text-sm font-bold" data-tab="catalog">Catálogo</button><button class="tab whitespace-nowrap rounded-full px-4 py-2 text-sm font-bold" data-tab="ordersTab">Pedidos</button><button class="tab whitespace-nowrap rounded-full px-4 py-2 text-sm font-bold" data-tab="metrics">Métricas de negocio</button></nav>
    <section id="catalog" class="tab-panel mt-6"><div class="mb-4 flex items-center justify-between"><h2 class="serif text-2xl font-bold">Catálogo</h2><span id="saveMsg" class="text-sm"></span></div><div id="products" class="space-y-3"></div></section>
    <section id="ordersTab" class="tab-panel mt-6 hidden"><div class="mb-4 flex items-center justify-between"><h2 class="serif text-2xl font-bold">Pedidos recientes</h2><span id="ordersHint" class="text-sm opacity-60"></span></div><div id="orders" class="space-y-3"></div></section>
    <section id="metrics" class="tab-panel mt-6 hidden"><div class="flex flex-wrap items-end justify-between gap-3"><div><h2 class="serif text-2xl font-bold">Métricas de negocio</h2><p id="metricsMode" class="mt-1 text-sm opacity-65"></p></div><button id="refreshMetrics" class="rounded-full bg-rosa px-4 py-2 text-sm font-bold">Actualizar</button></div><div id="kpis" class="mt-5 grid gap-3 sm:grid-cols-3"></div><div class="mt-5 grid gap-5 lg:grid-cols-2"><article class="rounded-3xl bg-white/75 p-4 shadow-sm"><h3 class="mb-3 font-bold">Postres más vendidos</h3><div class="h-64"><canvas id="topChart"></canvas></div></article><article class="rounded-3xl bg-white/75 p-4 shadow-sm"><h3 class="mb-3 font-bold">Ventas por periodo</h3><div class="h-64"><canvas id="salesChart"></canvas></div></article></div></section>
  </main>
<script>
const SUPABASE_URL='https://bmcstomcftwjyrcfptsb.supabase.co',SUPABASE_ANON_KEY='sb_publishable_aAEj9j1dap8YXXnRj_qAZw_McrrrmHb',ADMIN_PIN='2643';
const fallback=[{id:1,nombre:'Marquesa de parchita',precio:8,descripcion:'Postre frío de parchita en capas.',activo:true},{id:2,nombre:'Marquesa de chocolate',precio:8,descripcion:'Postre frío de chocolate en capas.',activo:true},{id:3,nombre:'Galletas con chispas',precio:6,descripcion:'Galletas horneadas con chispas.',activo:true},{id:4,nombre:'Galletas de doble chocolate',precio:7,descripcion:'Galletas de chocolate con trozos.',activo:true},{id:5,nombre:'Brownie individual',precio:5,descripcion:'Brownie húmedo con chispas.',activo:true},{id:6,nombre:'Torta de fresas con crema',precio:35,descripcion:'Torta decorada con crema y fresas.',activo:true},{id:7,nombre:'Torta de chocolate ganache',precio:40,descripcion:'Torta de chocolate con ganache.',activo:true},{id:8,nombre:'Torta temática',precio:45,descripcion:'Dinosaurios, Banban, Halloween u otro motivo.',activo:true}];
let products=fallback,orders=[],topChart,salesChart;const $=s=>document.querySelector(s),headers={apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json'};const live=()=>SUPABASE_URL.startsWith('https://');
async function api(path,opts={}){const r=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{...opts,headers:{...headers,...opts.headers}});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}
async function load(){if(live()){try{products=await api('productos?select=*&order=id');orders=await api('pedidos?select=*&order=created_at.desc&limit=100')}catch(e){console.error(e)}}renderProducts();renderOrders();renderMetrics()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function renderProducts(){$('#products').innerHTML=products.map(p=>`<article class="rounded-3xl bg-white/75 p-4 shadow-sm"><div class="flex flex-wrap items-start justify-between gap-3"><div class="min-w-[12rem] flex-1"><h3 class="font-bold">${esc(p.nombre)}</h3><textarea data-desc="${p.id}" class="mt-2 w-full rounded-2xl border-0 bg-crema p-3 text-sm outline-none ring-frambuesa focus:ring-2">${esc(p.descripcion)}</textarea></div><label class="w-28 text-xs font-bold">Precio<input data-price="${p.id}" type="number" min="0" step=".01" value="${p.precio}" class="mt-1 w-full rounded-xl border-0 bg-crema p-2"></label><label class="flex items-center gap-2 text-sm font-bold"><input data-active="${p.id}" type="checkbox" ${p.activo?'checked':''} class="h-5 w-5 accent-[#C72940]"> Activo</label></div><button data-save="${p.id}" class="mt-3 rounded-full bg-frambuesa px-4 py-2 text-sm font-bold text-white">Guardar cambios</button></article>`).join('');document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveProduct(Number(b.dataset.save)));document.querySelectorAll('[data-active]').forEach(b=>b.onchange=()=>saveProduct(Number(b.dataset.active),true))}
async function saveProduct(id,silent=false){const p=products.find(x=>x.id===id);p.precio=Number($(`[data-price="${id}"]`).value);p.descripcion=$(`[data-desc="${id}"]`).value;p.activo=$(`[data-active="${id}"]`).checked;if(live()){try{await api(`productos?id=eq.${id}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({precio:p.precio,descripcion:p.descripcion,activo:p.activo})});$('#saveMsg').textContent='Cambios guardados';setTimeout(()=>$('#saveMsg').textContent='',2000)}catch(e){$('#saveMsg').textContent='Error al guardar';console.error(e)}}else if(!silent){$('#saveMsg').textContent='Modo local: cambios visibles solo en esta sesión'}}
function orderItems(o){const d=o.detalles_json||{};return Array.isArray(d)?d:(d.items||[])}
function renderOrders(){$('#ordersHint').textContent=`${orders.length} registrados`;$('#orders').innerHTML=orders.length?orders.map(o=>`<article class="rounded-3xl bg-white/75 p-4 shadow-sm"><div class="flex flex-wrap items-start justify-between gap-3"><div><p class="font-bold">#DC-${String(o.id).padStart(4,'0')} · ${esc(o.cliente_nombre)}</p><p class="text-sm opacity-75">Entrega: ${esc(o.fecha_entrega)} · ${esc(o.cliente_whatsapp)}</p><p class="mt-2 text-sm">${orderItems(o).map(i=>`${i.cantidad} × ${esc(i.producto||i.nombre)}`).join(', ')||'Detalle no disponible'}</p></div><div class="text-right"><p class="font-bold text-frambuesa">$${Number(o.total).toFixed(2)}</p><select data-state="${o.id}" class="mt-2 rounded-xl border-0 bg-crema p-2 text-sm"><option ${o.estado==='Pendiente'?'selected':''}>Pendiente</option><option ${o.estado==='En Preparación'?'selected':''}>En Preparación</option><option ${o.estado==='Entregado'?'selected':''}>Entregado</option></select></div></div></article>`).join(''):'<p class="rounded-2xl bg-white/60 p-6 text-center opacity-70">Aún no hay pedidos registrados.</p>';document.querySelectorAll('[data-state]').forEach(s=>s.onchange=async()=>{try{if(live())await api(`pedidos?id=eq.${s.dataset.state}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({estado:s.value})});const o=orders.find(x=>x.id==s.dataset.state);if(o)o.estado=s.value;renderMetrics()}catch(e){console.error(e)}})}
function demoOrders(){const names=['Marquesa de chocolate','Galletas con chispas','Brownie individual','Torta de fresas con crema','Torta temática'];return Array.from({length:12},(_,i)=>({total:[28,42,18,65,75,36,54,22,88,47,31,70][i],created_at:new Date(Date.now()-(11-i)*7*86400000).toISOString(),detalles_json:{items:[{producto:names[i%names.length],cantidad:(i%3)+1}]}}))}
function renderMetrics(){const real=orders.length>0,source=real?orders:demoOrders(),month=new Date().toISOString().slice(0,7),monthOrders=source.filter(o=>String(o.created_at||'').slice(0,7)===month),revenue=monthOrders.reduce((s,o)=>s+Number(o.total||0),0),count=monthOrders.length;$('#metricsMode').textContent=real?'Datos basados en pedidos de Supabase.':'Sin pedidos reales todavía · mostrando datos de demostración.';$('#kpis').innerHTML=[['Ingresos del mes',`$${revenue.toFixed(2)}`],['Pedidos del mes',count],['Ticket promedio',`$${(count?revenue/count:0).toFixed(2)}`]].map(([a,b])=>`<article class="rounded-3xl bg-white/75 p-5 shadow-sm"><p class="text-sm opacity-70">${a}</p><p class="serif mt-2 text-3xl font-bold">${b}</p></article>`).join('');const totals={};source.forEach(o=>orderItems(o).forEach(i=>{const n=i.producto||i.nombre||'Producto';totals[n]=(totals[n]||0)+Number(i.cantidad||1)}));const top=Object.entries(totals).sort((a,b)=>b[1]-a[1]).slice(0,6);if(topChart)topChart.destroy();if(salesChart)salesChart.destroy();topChart=new Chart($('#topChart'),{type:'bar',data:{labels:top.map(x=>x[0]),datasets:[{data:top.map(x=>x[1]),backgroundColor:'#C72940',borderRadius:10}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});const buckets={};source.forEach(o=>{const d=new Date(o.created_at||Date.now()),key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;buckets[key]=(buckets[key]||0)+Number(o.total||0)});const labels=Object.keys(buckets).sort();salesChart=new Chart($('#salesChart'),{type:'line',data:{labels:labels.map(x=>x.slice(5)),datasets:[{label:'Ventas $',data:labels.map(x=>buckets[x]),borderColor:'#C72940',backgroundColor:'#F0C2D2',fill:true,tension:.35}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}})}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab-panel').forEach(x=>x.classList.add('hidden'));b.classList.add('active');$('#'+b.dataset.tab).classList.remove('hidden');if(b.dataset.tab==='metrics')renderMetrics()});$('#refreshMetrics').onclick=load;
$('#pinForm').onsubmit=e=>{e.preventDefault();if($('#pin').value===ADMIN_PIN){sessionStorage.admin='ok';showApp()}else $('#loginMsg').textContent='PIN incorrecto'};function showApp(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');load()}$('#logout').onclick=()=>{sessionStorage.removeItem('admin');location.reload()};if(sessionStorage.admin==='ok')showApp();
</script></body></html>
