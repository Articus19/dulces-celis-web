<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin · Dulces Celis</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{crema:'#F9F0DA',rosa:'#F0C2D2',frambuesa:'#C72940',chocolate:'#641410'}}}}</script><style>body{font-family:ui-sans-serif,system-ui,sans-serif;background:#F9F0DA;color:#641410}.serif{font-family:Georgia,serif}</style></head>
<body><div id="login" class="flex min-h-screen items-center justify-center p-5"><form id="pinForm" class="w-full max-w-sm rounded-3xl bg-white/70 p-7 text-center shadow-xl"><img src="assets/logo.png" class="mx-auto mb-5 h-20 w-32 object-contain" alt="Dulces Celis"><h1 class="serif text-3xl font-bold">Panel de control</h1><p class="mt-2 text-sm opacity-70">Ingresa el PIN para administrar el catálogo.</p><input id="pin" inputmode="numeric" type="password" maxlength="8" class="mt-6 w-full rounded-xl border-0 bg-crema p-3 text-center text-xl tracking-[.4em]" placeholder="••••" required><button class="mt-4 w-full rounded-full bg-frambuesa py-3 font-bold text-white">Entrar</button><p id="loginMsg" class="mt-3 text-sm text-frambuesa"></p></form></div><main id="app" class="mx-auto hidden max-w-6xl px-4 py-6"><header class="flex flex-wrap items-center justify-between gap-3"><div><p class="text-sm font-bold uppercase tracking-[.2em] text-frambuesa">Dulces Celis</p><h1 class="serif text-4xl font-bold">Panel de control</h1></div><div class="flex gap-2"><a href="index.html" class="rounded-full border border-frambuesa px-4 py-2 text-sm font-bold text-frambuesa">Ver tienda</a><button id="logout" class="rounded-full bg-rosa px-4 py-2 text-sm font-bold">Salir</button></div></header><section class="mt-8"><div class="mb-4 flex items-center justify-between"><h2 class="serif text-2xl font-bold">Catálogo</h2><span id="saveMsg" class="text-sm"></span></div><div id="products" class="space-y-3"></div></section><section class="mt-10 pb-10"><h2 class="serif mb-4 text-2xl font-bold">Pedidos recientes</h2><div id="orders" class="space-y-3"></div></section></main>
<script>
const SUPABASE_URL='https://bmcstomcftwjyrcfptsb.supabase.co',SUPABASE_ANON_KEY='sb_publishable_aAEj9j1dap8YXXnRj_qAZw_McrrrmHb',ADMIN_PIN='2643';const fallback=[{id:1,nombre:'Marquesa de parchita',precio:8,descripcion:'Postre frío de parchita en capas.',activo:true},{id:2,nombre:'Marquesa de chocolate',precio:8,descripcion:'Postre frío de chocolate en capas.',activo:true},{id:3,nombre:'Galletas con chispas',precio:6,descripcion:'Galletas horneadas con chispas.',activo:true},{id:4,nombre:'Galletas de doble chocolate',precio:7,descripcion:'Galletas de chocolate con trozos.',activo:true},{id:5,nombre:'Brownie individual',precio:5,descripcion:'Brownie húmedo con chispas.',activo:true},{id:6,nombre:'Torta de fresas con crema',precio:35,descripcion:'Torta decorada con crema y fresas.',activo:true},{id:7,nombre:'Torta de chocolate ganache',precio:40,descripcion:'Torta de chocolate con ganache.',activo:true},{id:8,nombre:'Torta temática',precio:45,descripcion:'Dinosaurios, Banban, Halloween u otro motivo.',activo:true}];let products=fallback,orders=[];const $=s=>document.querySelector(s),headers={apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json'};const live=()=>SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('tu-proyecto');
async function api(path,opts={}){const r=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{...opts,headers:{...headers,...opts.headers}});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}
async function load(){if(live()){try{products=await api('productos?select=*&order=id');orders=await api('pedidos?select=*&order=created_at.desc&limit=30')}catch(e){console.error(e)}}renderProducts();renderOrders()}
function renderProducts(){$('#products').innerHTML=products.map(p=>`<article class="rounded-2xl bg-white/70 p-4 shadow-sm"><div class="flex flex-wrap items-start justify-between gap-3"><div class="min-w-[12rem] flex-1"><h3 class="font-bold">${p.nombre}</h3><textarea data-desc="${p.id}" class="mt-2 w-full rounded-lg border-0 bg-crema p-2 text-sm">${p.descripcion||''}</textarea></div><div class="w-28"><label class="text-xs font-bold">Precio<input data-price="${p.id}" type="number" min="0" step=".01" value="${p.precio}" class="mt-1 w-full rounded-lg border-0 bg-crema p-2"></label></div><label class="flex items-center gap-2 text-sm font-bold"><input data-active="${p.id}" type="checkbox" ${p.activo?'checked':''} class="h-5 w-5 accent-[#C72940]"> Activo</label></div><button data-save="${p.id}" class="mt-3 rounded-full bg-frambuesa px-4 py-2 text-sm font-bold text-white">Guardar cambios</button></article>`).join('');document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveProduct(Number(b.dataset.save)));document.querySelectorAll('[data-active]').forEach(b=>b.onchange=()=>saveProduct(Number(b.dataset.active),true))}
async function saveProduct(id,silent=false){const p=products.find(x=>x.id===id);p.precio=Number($(`[data-price="${id}"]`).value);p.descripcion=$(`[data-desc="${id}"]`).value;p.activo=$(`[data-active="${id}"]`).checked;if(live()){try{await api(`productos?id=eq.${id}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({precio:p.precio,descripcion:p.descripcion,activo:p.activo})});$('#saveMsg').textContent='Cambios guardados';setTimeout(()=>$('#saveMsg').textContent='',2000)}catch(e){$('#saveMsg').textContent='Error al guardar';console.error(e)}}else if(!silent){$('#saveMsg').textContent='Modo local: cambios visibles solo en esta sesión';setTimeout(()=>$('#saveMsg').textContent='',3000)}}
function renderOrders(){$('#orders').innerHTML=orders.length?orders.map(o=>`<article class="rounded-2xl bg-white/70 p-4"><div class="flex flex-wrap items-start justify-between gap-3"><div><p class="font-bold">#DC-${String(o.id).padStart(4,'0')} · ${o.cliente_nombre}</p><p class="text-sm opacity-75">Entrega: ${o.fecha_entrega} · ${o.cliente_whatsapp}</p><p class="mt-2 text-sm">${(o.detalles_json||[]).map(i=>`${i.cantidad} × ${i.producto}`).join(', ')}</p></div><div class="text-right"><p class="font-bold text-frambuesa">$${Number(o.total).toFixed(2)}</p><select data-state="${o.id}" class="mt-2 rounded-lg border-0 bg-crema p-2 text-sm"><option ${o.estado==='Pendiente'?'selected':''}>Pendiente</option><option ${o.estado==='En Preparación'?'selected':''}>En Preparación</option><option ${o.estado==='Entregado'?'selected':''}>Entregado</option></select></div></div></article>`).join(''):'<p class="rounded-2xl bg-white/60 p-6 text-center opacity-70">Aún no hay pedidos registrados.</p>';document.querySelectorAll('[data-state]').forEach(s=>s.onchange=async()=>{if(live())await api(`pedidos?id=eq.${s.dataset.state}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({estado:s.value})});else{const o=orders.find(x=>x.id==s.dataset.state);if(o)o.estado=s.value}})}
$('#pinForm').onsubmit=e=>{e.preventDefault();if($('#pin').value===ADMIN_PIN){sessionStorage.admin='ok';showApp()}else $('#loginMsg').textContent='PIN incorrecto'};function showApp(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');load()}$('#logout').onclick=()=>{sessionStorage.removeItem('admin');location.reload()};if(sessionStorage.admin==='ok')showApp();
</script></body></html>
